<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIGA BANK - $600 + £300</title>
<style>
*{box-sizing:border-box}body{font-family:Arial;background:#000;color:#fff;padding:15px;margin:0}input,button{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:none;font-size:16px}input{background:#1a1a1a;color:#fff;border:1px solid #333}button{background:#FFD700;color:#000;font-weight:bold;cursor:pointer}button:active{transform:scale(0.98)}.card{background:#111;padding:16px;border-radius:14px;margin:12px 0;border:1px solid #222}.tabs{display:flex;gap:10px;margin:15px 0}.tab{flex:1;padding:14px;text-align:center;border-radius:10px;background:#222;cursor:pointer;font-weight:bold}.tab.active{background:#FFD700;color:#000}.tabContent{display:none}.tabContent.active{display:block}.balance{font-size:36px;font-weight:bold;margin:10px 0;color:#FFD700}small{color:#888}h1{color:#FFD700;text-align:center}
</style>
</head>
<body>
<h1>JIGA BANK 🏦</h1>
<p style="text-align:center">Public Bank - Get <b>$600 + £300 FREE</b></p>
<div id="auth">
<div class="card"><h3>1. Create Jiga Account</h3><input id="username" placeholder="Username"><input id="phone" placeholder="Choose Account Number e.g 08123456789"><input id="password" type="password" placeholder="Password"><button onclick="signUp()">CREATE - GET $600 + £300</button></div>
<div class="card"><h3>2. Login</h3><input id="loginPhone" placeholder="Your Account Number"><input id="loginPass" type="password" placeholder="Password"><button onclick="login()">LOGIN TO JIGA</button></div>
</div>
<div id="dash" style="display:none">
<div class="card" style="text-align:center">JIGA Account: <b id="accNum"></b><br><small id="userDisplay"></small></div>
<div class="tabs"><div id="tabDollar" class="tab active" onclick="openTab('dollar')">💵 DOLLAR</div><div id="tabPound" class="tab" onclick="openTab('pound')">💷 POUNDS</div></div>
<div id="contentDollar" class="tabContent active"><div class="card"><small>USD Account</small><br><b id="usdAccNum"></b><div class="balance">$<span id="usdBal">0</span></div><small>JIGA Welcome $600</small></div><div class="card"><h3>Send Dollar</h3><input id="toDollar" placeholder="Receiver Account Number"><input id="amountDollar" type="number" placeholder="Amount"><button onclick="sendDollar()">SEND USD NOW</button></div><div class="card"><h3>USD History</h3><div id="usdHistory"></div></div></div>
<div id="contentPound" class="tabContent"><div class="card"><small>GBP Account</small><br><b id="gbpAccNum"></b><div class="balance">£<span id="gBal">0</span></div><small>JIGA Welcome £300</small></div><div class="card"><h3>Send Pounds</h3><input id="toPound" placeholder="Receiver Account Number"><input id="amountPound" type="number" placeholder="Amount"><button onclick="sendPound()">SEND GBP NOW</button></div><div class="card"><h3>GBP History</h3><div id="gbpHistory"></div></div></div>
<div class="card"><button onclick="location.reload()" style="background:#333;color:#fff">LOGOUT</button></div>
</div>
<script>
const MASTER_KEY = "$2a$10$CjKdlLbamwTX2LMTISKVt.j0Q0.98y/N4EWPbQo4AOMQoxn2Y2o7W"
const DOLLAR_BIN = "6aaedb9bffd5d160531a2fd6"
const POUND_BIN = "6aaedaaaffd5d160531a2dc0"
const USERS_BIN = "6aaeda5fac6210605ae099fe"
let currentPhone = ""
function openTab(tab){document.getElementById('tabDollar').classList.remove('active');document.getElementById('tabPound').classList.remove('active');document.getElementById('contentDollar').classList.remove('active');document.getElementById('contentPound').classList.remove('active');if(tab==='dollar'){document.getElementById('tabDollar').classList.add('active');document.getElementById('contentDollar').classList.add('active')}else{document.getElementById('tabPound').classList.add('active');document.getElementById('contentPound').classList.add('active')}}
async function getBin(id){const res=await fetch(`https://api.jsonbin.io/v3/b/${id}/latest`,{headers:{'X-Master-Key':MASTER_KEY}});const j=await res.json();return j.record}
async function putBin(id,data){await fetch(`https://api.jsonbin.io/v3/b/${id}`,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY},body:JSON.stringify(data)})}
async function signUp(){const username=document.getElementById('username').value.trim();const phone=document.getElementById('phone').value.trim();const password=document.getElementById('password').value.trim();if(!username||!phone||!password) return alert("Fill all");let users=await getBin(USERS_BIN);let dollars=await getBin(DOLLAR_BIN);let pounds=await getBin(POUND_BIN);if(!users.users) users={users:[]};if(!dollars.accounts) dollars={accounts:[]};if(!pounds.accounts) pounds={accounts:[]};if(users.users.find(u=>u.accountNumber===phone)) return alert("Account number taken!");users.users.push({username,accountNumber:phone,phone,password,createdAt:new Date().toLocaleString()});dollars.accounts.push({accountNumber:phone,username,balance:600,currency:"USD",transactions:[{type:"JIGA BONUS",amount:600,from:"Welcome $600",date:new Date().toLocaleString()}]});pounds.accounts.push({accountNumber:phone,username,balance:300,currency:"GBP",transactions:[{type:"JIGA BONUS",amount:300,from:"Welcome £300",date:new Date().toLocaleString()}]});await putBin(USERS_BIN,users);await putBin(DOLLAR_BIN,dollars);await putBin(POUND_BIN,pounds);alert("JIGA Account "+phone+" created with $600 + £300!");document.getElementById('loginPhone').value=phone;document.getElementById('loginPass').value=password;login()}
async function login(){const phone=document.getElementById('loginPhone').value.trim();const pass=document.getElementById('loginPass').value.trim();let users=await getBin(USERS_BIN);let user=(users.users||[]).find(u=>u.accountNumber===phone && u.password===pass);if(!user) return alert("Wrong account or password");currentPhone=phone;let dollars=await getBin(DOLLAR_BIN);let pounds=await getBin(POUND_BIN);let usd=(dollars.accounts||[]).find(a=>a.accountNumber===phone);let gbp=(pounds.accounts||[]).find(a=>a.accountNumber===phone);document.getElementById('auth').style.display='none';document.getElementById('dash').style.display='block';document.getElementById('accNum').innerText=phone;document.getElementById('userDisplay').innerText=user.username;document.getElementById('usdAccNum').innerText=usd.accountNumber;document.getElementById('usdBal').innerText=usd.balance;document.getElementById('gbpAccNum').innerText=gbp.accountNumber;document.getElementById('gBal').innerText=gbp.balance;document.getElementById('usdHistory').innerHTML=usd.transactions.slice().reverse().map(t=>`<div style="padding:10px;border-bottom:1px solid #222"><b>${t.type}</b> $${t.amount}<br><small>${t.date} ${t.to?'→ '+t.to:''} ${t.from?'← '+t.from:''}</small></div>`).join('');document.getElementById('gbpHistory').innerHTML=gbp.transactions.slice().reverse().map(t=>`<div style="padding:10px;border-bottom:1px solid #222"><b>${t.type}</b> £${t.amount}<br><small>${t.date} ${t.to?'→ '+t.to:''} ${t.from?'← '+t.from:''}</small></div>`).join('');openTab('dollar')}
async function sendDollar(){const to=document.getElementById('toDollar').value.trim();const amount=parseFloat(document.getElementById('amountDollar').value);if(!to||!amount) return alert("Enter account + amount");let data=await getBin(DOLLAR_BIN);let from=data.accounts.find(a=>a.accountNumber===currentPhone);let toAcc=data.accounts.find(a=>a.accountNumber===to);if(!toAcc) return alert("Not found: "+to);if(from.balance<amount) return alert("Insufficient");from.balance-=amount;toAcc.balance+=amount;from.transactions.push({type:"SENT",amount,currency:"USD",to,date:new Date().toLocaleString()});toAcc.transactions.push({type:"RECEIVED",amount,currency:"USD",from:currentPhone,date:new Date().toLocaleString()});await putBin(DOLLAR_BIN,data);alert("Sent $"+amount+" to "+to);login()}
async function sendPound(){const to=document.getElementById('toPound').value.trim();const amount=parseFloat(document.getElementById('amountPound').value);if(!to||!amount) return alert("Enter account + amount");let data=await getBin(POUND_BIN);let from=data.accounts.find(a=>a.accountNumber===currentPhone);let toAcc=data.accounts.find(a=>a.accountNumber===to);if(!toAcc) return alert("Not found: "+to);if(from.balance<amount) return alert("Insufficient");from.balance-=amount;toAcc.balance+=amount;from.transactions.push({type:"SENT",amount,currency:"GBP",to,date:new Date().toLocaleString()});toAcc.transactions.push({type:"RECEIVED",amount,currency:"GBP",from:currentPhone,date:new Date().toLocaleString()});await putBin(POUND_BIN,data);alert("Sent £"+amount+" to "+to);login();openTab('pound')}
</script>
</body>
</html>
